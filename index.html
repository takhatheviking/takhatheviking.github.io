<html lang="ru">
<head>
<meta charset="utf-8">

<style>
:root{--bg:#0B0C0E;--win:#111316;--pl:#1A1C20;--ln:rgba(255,255,255,.1);--fg:#F2F2F0;--dim:#B4B7BD;--cap:#8F9299;--lime:#C6F24E;--blue:#5BC8FF;--amber:#F0B458;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Inter',system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--lime);outline-offset:3px;border-radius:6px}
.page{position:relative;overflow:clip}
.dots{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.17) 1px,transparent 1.5px);background-size:24px 24px;background-position:-12px -12px}
.warp{position:absolute;left:0;top:0;width:480px;height:480px;pointer-events:none;opacity:0}
.star{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;pointer-events:none;opacity:0;transition:opacity .9s ease}
.star svg{display:block;width:22px;height:22px;fill:none;stroke:var(--lime);stroke-width:1.4;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* северное сияние на весь сайт: неподвижный слой за содержимым, движутся только сами ленты */
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:.5}
.aurora::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,12,14,0) 0,rgba(11,12,14,.5) 55%,rgba(11,12,14,.92) 100%)}
.aurora i{position:absolute;display:block;border-radius:50%;filter:blur(70px);mix-blend-mode:screen;will-change:transform}
.aurora i:nth-child(1){left:-12%;top:-20%;width:72vw;height:48vh;background:linear-gradient(100deg,transparent,rgba(61,224,168,.85) 38%,rgba(198,242,78,.7) 60%,transparent);animation:av1 26s ease-in-out infinite alternate}
.aurora i:nth-child(2){right:-16%;top:-10%;width:66vw;height:42vh;background:linear-gradient(80deg,transparent,rgba(91,200,255,.8) 40%,rgba(142,123,255,.7) 64%,transparent);animation:av2 33s ease-in-out infinite alternate}
.aurora i:nth-child(3){left:18%;top:14%;width:62vw;height:30vh;background:linear-gradient(95deg,transparent,rgba(198,242,78,.5) 30%,rgba(61,224,168,.6) 55%,transparent);animation:av3 22s ease-in-out infinite alternate}
.aurora i:nth-child(4){left:-22%;top:34%;width:58vw;height:26vh;opacity:.55;background:linear-gradient(110deg,transparent,rgba(142,123,255,.6) 35%,rgba(91,200,255,.6) 60%,transparent);animation:av4 39s ease-in-out infinite alternate}
@keyframes av1{0%{transform:translate(-4%,0) rotate(-8deg) scaleY(.8)}100%{transform:translate(10%,6%) rotate(4deg) scaleY(1.15)}}
@keyframes av2{0%{transform:translate(6%,4%) rotate(10deg) scaleY(1.1)}100%{transform:translate(-12%,-2%) rotate(-5deg) scaleY(.75)}}
@keyframes av3{0%{transform:translate(-8%,-6%) rotate(-3deg) scaleY(.7)}100%{transform:translate(9%,8%) rotate(7deg) scaleY(1.2)}}
@keyframes av4{0%{transform:translate(0,6%) rotate(6deg) scaleY(1)}100%{transform:translate(18%,-8%) rotate(-9deg) scaleY(.7)}}
/* настоящий текучий фон (WebGL) рисуется в половинном размере и растягивается; ленты выше остаются запасным вариантом */
#aurora-gl{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease}
.aurora.gl #aurora-gl{opacity:1}
.aurora.gl i{display:none}
.aurora.gl{opacity:.95}
.aurora.gl::after{background:linear-gradient(180deg,rgba(11,12,14,.22) 0,rgba(11,12,14,.46) 50%,rgba(11,12,14,.8) 100%)}
@media (max-width:720px){.aurora i{filter:blur(46px)}.aurora i:nth-child(4){display:none}}
.wrap{z-index:1;position:relative;max-width:1180px;margin:0 auto;padding:0 clamp(16px,4vw,40px)}
.mono{font-family:var(--mono)}
/* nav */
.nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;padding:16px 0;font-size:14px}
.nav::before{content:"";position:absolute;z-index:-1;top:0;bottom:0;left:50%;width:100vw;transform:translateX(-50%);background:rgba(11,12,14,.72);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.08);opacity:0;transition:opacity .25s}
.nav.stuck::before{opacity:1}
.brand{font-weight:700;font-size:16px;text-decoration:none}
.nav-r{display:flex;align-items:center;gap:8px 22px;flex-wrap:wrap}
.nav-l{display:flex;gap:22px;flex-wrap:wrap}
.nav-l a{color:var(--dim);text-decoration:none}
.nav-l a:hover{color:var(--fg)}
.lang{display:flex;padding:3px;border:1px solid rgba(255,255,255,.16);border-radius:999px;font-family:var(--mono);font-size:12px}
.lang button{min-width:44px;height:38px;padding:0 10px;border:0;border-radius:999px;background:none;color:var(--dim)}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg);font-weight:700}
.pill{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 20px;border-radius:999px;font-weight:600;font-size:15px;text-decoration:none;border:1px solid transparent}
.pill.light{background:var(--fg);color:var(--bg)}
.pill.go{background:var(--lime);color:var(--bg);height:48px}
.pill.ghost{border-color:rgba(255,255,255,.22);height:48px}
/* hero */
.hero{padding:clamp(24px,4vw,44px) 0 28px;display:flex;flex-direction:column;gap:16px}
.h-name{display:block;margin:0 0 14px;font-size:clamp(16px,1.5vw,20px);line-height:1.3;font-weight:500;letter-spacing:0;color:var(--dim)}
.hero-b{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 40px;flex-wrap:wrap}
.badge{font-family:var(--mono);font-size:13px;color:var(--lime)}
h1{white-space:pre-line;margin:0;max-width:1000px;font-size:clamp(30px,4.2vw,52px);line-height:1.05;font-weight:600;letter-spacing:-.035em}
.lead{margin:0;flex:1 1 420px;max-width:600px;font-size:clamp(15px,1.4vw,17px);color:var(--dim)}
.cta{display:flex;gap:10px;flex-wrap:wrap}
/* project stage */
.pm{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 32px;flex-wrap:wrap;padding-top:14px}
#projects h2{font-size:clamp(22px,2.4vw,30px)}
#projects .pm-l p{font-size:16px}
#projects{display:flex;flex-direction:column}
#projects .tabs{order:-1;margin:0;padding:6px 2px 2px;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 56px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 56px),transparent)}
#projects .pm{align-items:center;padding:10px 2px 14px;flex-wrap:nowrap}
#projects .pm-l{flex:1 1 auto;flex-direction:row;align-items:baseline;gap:6px 14px;flex-wrap:wrap}
#projects .pm-meta{flex:none}
#projects #pcat{display:none}
#projects #ptitle{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
#projects .pm-l p{flex:1 1 320px;max-width:none;font-size:15px}
#projects .pm-nav{flex:none}
#projects .arr{width:38px;height:38px}
.pm-l{flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:10px;transition:opacity .25s}
.pm-l.sw{opacity:0}
.pm-meta{display:flex;gap:8px 16px;flex-wrap:wrap;font-family:var(--mono);font-size:13px;color:var(--cap)}
.st{display:inline-flex;align-items:center;gap:7px}
.st i{width:8px;height:8px;display:block;background:currentColor}
.st.live{color:var(--blue)}.st.live i{border-radius:50%}
.st.wip{color:var(--amber)}
.st.done{color:var(--lime)}
h2{margin:0;font-size:clamp(26px,3.2vw,40px);line-height:1.08;font-weight:600;letter-spacing:-.03em}
.pm-l p{margin:0;max-width:640px;color:var(--dim);font-size:17px}
.pm-nav{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:13px;color:var(--cap)}
.arr{width:46px;height:46px;display:grid;place-items:center;border-radius:50%;background:none;border:1px solid rgba(255,255,255,.2)}
.arr:hover{background:var(--fg);color:var(--bg)}
.arr svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:22px 0 6px;padding:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;flex:none;height:44px;padding:0 14px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:rgba(17,19,22,.8);color:var(--dim);font-size:14px;white-space:nowrap;overflow:hidden}
.tab b{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--cap);margin-right:8px}
.tab[aria-selected="true"]{color:var(--fg);border-color:rgba(198,242,78,.5)}
.tab::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--lime);transform:scaleX(0);transform-origin:left}
.tab.run::after{animation:fill var(--dur,10s) linear forwards}
@keyframes fill{to{transform:scaleX(1)}}
.vp{--vw:min(1180px,100vw - 16px);position:relative;width:var(--vw);margin:0 calc((100% - var(--vw)) / 2);transition:height .6s cubic-bezier(.2,.7,.2,1)}
/* северное сияние: три размытые ленты, которые медленно плывут */
.halo{position:absolute;left:4%;right:4%;top:-110px;height:320px;pointer-events:none;filter:blur(38px);opacity:.6}
.halo i,.halo::before,.halo::after{content:"";display:block;position:absolute;inset:0;border-radius:50%;mix-blend-mode:screen}
.halo i{background:linear-gradient(100deg,transparent 8%,rgba(61,224,168,.9) 34%,rgba(198,242,78,.85) 52%,transparent 78%);transform:skewX(-18deg) scaleY(.55);animation:au1 12s ease-in-out infinite alternate}
.halo::before{background:linear-gradient(80deg,transparent 20%,rgba(91,200,255,.8) 45%,rgba(142,123,255,.7) 62%,transparent 86%);transform:translateY(18%) skewX(14deg) scaleY(.4);animation:au2 16s ease-in-out infinite alternate}
.halo::after{background:linear-gradient(95deg,transparent 0,rgba(198,242,78,.6) 22%,rgba(61,224,168,.7) 40%,transparent 60%);transform:translateY(-12%) skewX(-8deg) scaleY(.35);animation:au3 10s ease-in-out infinite alternate}
@keyframes au1{0%{transform:translateX(-6%) skewX(-18deg) scaleY(.55);opacity:.75}100%{transform:translateX(7%) skewX(-6deg) scaleY(.7);opacity:1}}
@keyframes au2{0%{transform:translate(8%,18%) skewX(14deg) scaleY(.4);opacity:.9}100%{transform:translate(-9%,8%) skewX(2deg) scaleY(.55);opacity:.6}}
@keyframes au3{0%{transform:translate(-4%,-12%) skewX(-8deg) scaleY(.35);opacity:.5}100%{transform:translate(10%,-4%) skewX(-20deg) scaleY(.5);opacity:.95}}
@keyframes breath{0%,100%{opacity:.3;transform:scale(.94)}50%{opacity:.55;transform:scale(1.04)}}
.clip{position:relative;overflow:hidden;height:100%}
.track{display:flex;height:100%;transition:transform .8s cubic-bezier(.65,0,.2,1)}
.slide{flex:0 0 100%;min-width:0;overflow:hidden}
.slide iframe{display:block;width:100%;height:100%;border:0;background:transparent;transform-origin:0 0}
.note{margin:8px 0 0;font-family:var(--mono);font-size:12px;color:var(--cap)}
/* sections */
.sec{position:relative;padding:clamp(72px,10vw,130px) 0 0}
.sec>*:not(.halo){position:relative}
.halo.h-a{left:-12%;right:auto;top:32%;width:min(720px,80%);height:260px;opacity:.5}
.halo.h-b{left:auto;right:-10%;top:auto;bottom:4%;width:min(780px,85%);height:280px;opacity:.5}
.halo.h-c{left:18%;right:auto;top:4%;width:min(740px,80%);height:240px;opacity:.45}
.ico-r{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.ico{width:40px;height:40px;fill:none;stroke:var(--fg);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.ico .a-fill,.figure .a-fill{fill:var(--lime);stroke:none}
.a-rot{transform-box:view-box;transform-origin:50% 50%;animation:spin 7s linear infinite}
.a-dash{stroke-dasharray:3 3;animation:dash 1.6s linear infinite}
.a-p1,.a-p2,.a-p3{fill:var(--bg);animation:pulse 2.4s ease-in-out infinite}
.a-p2{animation-delay:.8s}.a-p3{animation-delay:1.6s}
.a-draw{stroke:var(--lime);stroke-width:1.8;stroke-dasharray:1;animation:draw 3s ease-in-out infinite}
.a-bob{stroke:var(--lime);animation:bob 2.6s ease-in-out infinite}
@keyframes dash{to{stroke-dashoffset:-12}}
@keyframes pulse{0%,100%{stroke:var(--fg)}35%{stroke:var(--lime);fill:var(--lime)}}
@keyframes draw{0%{stroke-dashoffset:1}45%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
.figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.fig{display:flex;flex-direction:column;gap:10px;padding:4px 32px 8px;border-left:1px solid var(--ln)}
.fig:first-child{padding-left:0;border-left:0}
.fig:last-child{padding-right:0}
.fig h3{margin:8px 0 0;font-size:18px;font-weight:600}
.fig p{margin:0;color:var(--dim);font-size:16px;max-width:340px}
.figure{height:clamp(200px,23vw,300px);width:auto;max-width:100%;aspect-ratio:1;flex:none;align-self:center;margin:8px 0 12px;fill:none;stroke:var(--fg);stroke-width:.7;stroke-linejoin:round;overflow:visible}
.figure{stroke-width:.8;stroke-linecap:round}.figure .w-f{fill:rgba(17,19,22,.8)}.figure .w-dim{opacity:.32}.figure .w-l{stroke:var(--lime)}.figure .w-lf{fill:var(--lime);stroke:var(--lime)}.figure .w-g{stroke:rgba(242,242,240,.22)}
.f-scan{animation:scan 5s ease-in-out infinite}
.f-rise{animation:rise 3.6s ease-in-out infinite}
.f-core{animation:spin 16s linear infinite}
@keyframes scan{0%,100%{transform:translateY(4px)}50%{transform:translateY(86px)}}
@keyframes rise{0%,100%{transform:translateY(16px)}50%{transform:translateY(0)}}
@media (max-width:860px){.figs{grid-template-columns:1fr;gap:40px}.fig,.fig:first-child,.fig:last-child{padding:0;border-left:0}.figure{height:260px}}
.sec-h{display:flex;flex-direction:column;gap:14px;margin-bottom:34px}
.sec-b{font-family:var(--mono);font-size:13px;color:var(--cap)}
.sec-a{margin:0;max-width:720px;color:var(--dim);font-size:17px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.card{position:relative;background:rgba(17,19,22,.92);border:1px solid var(--ln);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-size:20px;line-height:1.2;font-weight:600;letter-spacing:-.01em}
.card p{margin:0;color:var(--dim);font-size:15px}
.num{font-family:var(--mono);font-size:12px;color:var(--lime)}
.plan .price{font-family:var(--mono);font-size:15px;color:var(--lime)}
.plan ul{margin:6px 0 10px;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px;font-size:15px;color:var(--dim)}
.plan li{position:relative;padding-left:18px}
.plan li::before{content:"";position:absolute;left:0;top:.6em;width:7px;height:7px;background:var(--lime);transform:rotate(45deg)}
.plan .pill{margin-top:auto;align-self:flex-start}
.tag{align-self:flex-start;padding:2px 9px;border:1px solid rgba(198,242,78,.4);border-radius:999px;font-family:var(--mono);font-size:11px;color:var(--lime)}
.end{margin:clamp(80px,11vw,150px) 0 40px;padding-top:48px;border-top:1px solid var(--ln);display:flex;flex-direction:column;align-items:flex-start;gap:24px}
.end h2{max-width:860px;font-size:clamp(30px,4.6vw,58px);line-height:1.05}
.links{display:flex;gap:10px 28px;flex-wrap:wrap;font-size:15px;color:var(--dim)}
.links a{text-decoration:none;display:inline-flex;gap:8px;min-height:44px;align-items:center}
.links a:hover{color:var(--fg)}
.links span{font-family:var(--mono);font-size:12px;color:var(--cap)}
.foot{padding:20px 0 36px;font-family:var(--mono);font-size:12px;color:var(--cap)}
@media (max-width:720px){.nav{flex-wrap:nowrap;gap:8px;padding:10px 0}.nav-r{flex-wrap:nowrap;gap:8px}.lang button{min-width:30px;height:40px;padding:0 5px}.nav .pill{height:44px;padding:0 10px;font-size:14px;white-space:nowrap}.nav-l{display:none}#projects .pm-nav{display:none}#projects .pm{align-items:flex-start;min-height:118px}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="page" id="page">
<div class="aurora" id="aurora" aria-hidden="true"><div id="aurora-gl"></div><i></i><i></i><i></i><i></i></div>

<div class="wrap">
  <header class="nav">
    <a class="brand" href="#top">Viking Labs</a>
    <div class="nav-r">
      <nav class="nav-l" id="navl"></nav>
      <div class="lang" role="group" aria-label="Язык сайта" id="lang">
        <button type="button" data-l="ru">RU</button><button type="button" data-l="uz">UZ</button><button type="button" data-l="en">EN</button>
      </div>
      <a class="pill light" href="#contact" data-t="navcta"></a>
    </div>
  </header>

  <section class="hero" id="top">
    <h1 data-t="h1"></h1>
    <div class="hero-b">
      <p class="lead" data-t="lead"></p>
      <div class="cta">
        <a class="pill go" href="#contact" data-t="b1"></a>
        <a class="pill ghost" href="#services" data-t="b2"></a>
      </div>
    </div>
  </section>

  <section id="projects" aria-roledescription="carousel">
    <div class="pm">
      <div class="pm-l" id="pml" aria-live="polite">
        <div class="pm-meta"><span id="pcat"></span><span class="st" id="pst"><i></i><span></span></span></div>
        <h2 id="ptitle"></h2>
        <p id="pben"></p>
      </div>
      <div class="pm-nav">
        <span id="pnum"></span>
        <span style="display:flex;gap:8px">
          <button class="arr" type="button" id="prev"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 6l-6 6 6 6"/></svg></button>
          <button class="arr" type="button" id="next"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6l6 6-6 6"/></svg></button>
        </span>
      </div>
    </div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="vp" id="vp">
      <div class="clip"><div class="track" id="track"></div></div>
    </div>
    <p class="note" data-t="note"></p>
  </section>

  <section class="sec" id="services">
    <div class="sec-h"><div class="sec-b" data-t="sb1"></div><h2 data-t="st1"></h2><p class="sec-a" data-t="sa1"></p></div>
    <div class="grid" id="svc"></div>
  </section>

  <section class="sec" id="process">
    <div class="sec-h"><div class="sec-b" data-t="sb3"></div><h2 data-t="st3"></h2></div>
    <div class="figs" id="steps"></div>
  </section>

  <section class="sec" id="products">
    <div class="sec-h"><div class="sec-b" data-t="sb2"></div><h2 data-t="st2"></h2><p class="sec-a" data-t="sa2"></p></div>
    <div class="grid" id="plans"></div>
    <p class="note" data-t="sn2"></p>
  </section>

  <section class="end" id="contact">
    <div class="sec-b" data-t="sb4"></div>
    <h2 data-t="st4"></h2>

 '<g class="a-rot"><path d="M5 12a7 7 0 0 1 12.2-4.7"/><path d="M17.6 3.4v4.2h-4.2"/><path d="M19 12a7 7 0 0 1-12.2 4.7"/><path d="M6.4 20.6v-4.2h4.2"/></g>',
 '<path d="M3 7h10M3 12h16M3 17h7" class="a-dash"/><circle r="1.6" class="a-fill"><animateMotion dur="2.4s" repeatCount="indefinite" path="M3 12H21"/></circle>',
 '<path d="M6 7l6 10 6-10z" opacity=".5"/><circle cx="6" cy="7" r="2.2" class="a-p1"/><circle cx="18" cy="7" r="2.2" class="a-p2"/><circle cx="12" cy="17" r="2.2" class="a-p3"/>',
 '<path d="M4 6h9M4 11h9M4 16h6" opacity=".6"/><path d="M14.5 14.5l2.4 2.4 4.4-5.4" pathLength="1" class="a-draw"/>',
 '<path d="M12 13l8 4-8 4-8-4z" opacity=".45"/><path d="M12 9l8 4-8 4-8-4z" opacity=".7"/><path d="M12 3l8 4-8 4-8-4z" class="a-bob"/>',
 '<path d="M3 19l5-8 5 4 8-11" opacity=".6"/><circle r="1.8" class="a-fill"><animateMotion dur="3.2s" repeatCount="indefinite" path="M3 19l5-8 5 4 8-11"/></circle><path d="M17 4h4v4" opacity=".6"/>'
];
/* крупные фигуры порядка работы: объёмный каркас, рисуется по времени */
var drawFigs=(function(){
var OY=120;
function P(x,y,z){return (100+(x-y)*.866).toFixed(1)+' '+(OY+(x+y)*.5-z).toFixed(1)}
function pg(pts,cls,op){return '<path class="'+cls+'"'+(op!=null?' opacity="'+op.toFixed(2)+'"':'')+' d="M'+pts.map(function(p){return P(p[0],p[1],p[2])}).join('L')+'Z"/>'}
function ln(a,b,cls){return '<path class="'+(cls||'')+'" d="M'+P(a[0],a[1],a[2])+'L'+P(b[0],b[1],b[2])+'"/>'}
function box(x,y,z,w,d,h,cls){cls='w-f '+(cls||'');var X=x+w,Y=y+d,Z=z+h;
  return pg([[X,y,z],[X,Y,z],[X,Y,Z],[X,y,Z]],cls)+pg([[x,Y,z],[X,Y,z],[X,Y,Z],[x,Y,Z]],cls)+pg([[x,y,Z],[X,y,Z],[X,Y,Z],[x,Y,Z]],cls)}
function ez(v){v=v<0?0:v>1?1:v;return v*v*(3-2*v)}
function ground(r){return pg([[-r,-r,0],[r,-r,0],[r,r,0],[-r,r,0]],'w-g')}
function fig1(t){OY=132;var s=ground(56),i;
  var out=ez((t-.3)/.18)-ez((t-.8)/.15);
  var zs=62*(t<.3?1-t/.3:t<.8?0:(t-.8)/.2);
  for(i=0;i<6;i++){var o=i===2?out*40:0;
    s+=box(-32+o,-23,i*9,64,46,3,i===2&&out>.02?'w-l':'');
    if(i===2&&out>.5){s+=ln([-22+o,-12,21.2],[18+o,-12,21.2],'w-l')+ln([-22+o,-2,21.2],[22+o,-2,21.2],'w-l')+ln([-22+o,8,21.2],[8+o,8,21.2],'w-l')}}
  s+=ln([-22,-12,48.2],[18,-12,48.2],'w-dim')+ln([-22,-2,48.2],[22,-2,48.2],'w-dim')+ln([-22,8,48.2],[8,8,48.2],'w-dim');
  s+=pg([[-40,-31,zs+1.5],[40,-31,zs+1.5],[40,31,zs+1.5],[-40,31,zs+1.5]],'w-l');
  return s}
function desk(y0,on,t){var x0=-31,s='',c=on?'':'w-dim';
  s+=ln([x0+2,y0+2,0],[x0+2,y0+2,28],c)+ln([x0+60,y0+2,0],[x0+60,y0+2,28],c)+ln([x0+2,y0+34,0],[x0+2,y0+34,28],c)+ln([x0+60,y0+34,0],[x0+60,y0+34,28],c);
  s+=box(x0,y0,28,62,36,3,c);
  s+=ln([x0+31,y0+12,31],[x0+31,y0+12,38],c)+ln([x0+24,y0+12,31],[x0+38,y0+12,31],c);
  s+=box(x0+12,y0+10,38,38,3,25,c);
  if(on){var yf=y0+13.1,hs=[8,13,19],i;
    for(i=0;i<3;i++){var h=hs[i]*(ez((t-.12-i*.12)/.22)-ez((t-.88)/.1));if(h<.4)h=.4;var bx=x0+18+i*9.5;
      s+=pg([[bx,yf,41],[bx+6,yf,41],[bx+6,yf,41+h],[bx,yf,41+h]],'w-lf')}
    s+=box(x0+20,y0+22,31,22,8,1,'')}
  return s}
function fig2(t){OY=128;return ground(74)+desk(-62,false,t)+desk(-18,true,t)+desk(26,false,t)}
function fig3(t){OY=140;var s=ground(52),k,j;
  for(k=0;k<3;k++){var z=k*24,on=ez((t-.12-k*.2)/.12)-ez((t-.9)/.08);
    s+=box(-30,-22,z,60,44,20,'');
    for(j=0;j<3;j++){var y=-22+6+j*13,w=[[30.1,y,z+6],[30.1,y+8,z+6],[30.1,y+8,z+14],[30.1,y,z+14]];s+=pg(w,'w-dim');if(on>.02)s+=pg(w,'w-lf',on)}
    for(j=0;j<4;j++){var x=-30+5+j*14,v=[[x,22.1,z+6],[x+8,22.1,z+6],[x+8,22.1,z+14],[x,22.1,z+14]];s+=pg(v,'w-dim');if(on>.02)s+=pg(v,'w-lf',on)}}
  s+=box(-33,-25,72,66,50,2,'');
  return s}
var F=[[fig1,7000],[fig2,7000],[fig3,8000]];
return function(now,fixed){for(var i=0;i<3;i++){var e=document.getElementById('fg'+i);if(e)e.innerHTML=F[i][0](fixed!=null?fixed:(now%F[i][1])/F[i][1])}}
})();
var vLang={uz:false,en:false};
var $=function(id){return document.getElementById(id)};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var still=matchMedia('(prefers-reduced-motion: reduce)').matches;
var lang='ru';
try{var sv=localStorage.getItem('vk-lang');if(sv&&T[sv])lang=sv}catch(e){}

/* ---------- тексты ---------- */
function paintText(){
  var t=T[lang];document.documentElement.lang=lang;
  document.querySelectorAll('[data-t]').forEach(function(e){e.textContent=t[e.dataset.t]||''});
  var hp=t.h1.split('\n');document.querySelector('[data-t="h1"]').innerHTML='<span class="h-name">'+esc(hp[0])+'</span>'+esc(hp.slice(1).join(' '));
  $('navl').innerHTML=t.nav.map(function(n,i){return '<a href="'+HREF[i]+'">'+esc(n)+'</a>'}).join('');
  document.querySelectorAll('#lang button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.l===lang)});
  $('svc').innerHTML=t.svc.map(function(s,i){return '<article class="card"><div class="ico-r"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true">'+ICO[i]+'</svg><div class="num">0'+(i+1)+'</div></div><h3>'+esc(s[0])+'</h3><p>'+esc(s[1])+'</p></article>'}).join('');
  $('plans').innerHTML=t.plans.map(function(p){return '<article class="card plan">'+(p.tag?'<span class="tag">'+esc(p.tag)+'</span>':'')+'<h3>'+esc(p.n)+'</h3><div class="price">'+esc(p.w)+' · '+esc(p.p)+'</div><p>'+esc(p.d)+'</p><ul>'+p.f.map(function(f){return '<li>'+esc(f)+'</li>'}).join('')+'</ul><a class="pill ghost" href="'+p.u+'">'+esc(p.c)+'</a></article>'}).join('');
  $('steps').innerHTML=t.steps.map(function(s,i){return '<article class="fig"><div class="num">0'+(i+1)+'</div><svg class="figure" id="fg'+i+'" viewBox="0 0 200 200" aria-hidden="true"></svg><h3>'+esc(s[0])+'</h3><p>'+esc(s[1])+'</p></article>'}).join('');drawFigs(0,.6);
  document.querySelector('[data-t="note"]').textContent=(lang==='ru'||vLang[lang])?'':t.note;
  $('links').innerHTML=LINKS.map(function(l,i){return '<a href="'+l[1]+'"><span>'+esc(t.ll[i])+'</span>'+esc(l[0])+'</a>'}).join('');
  $('prev').setAttribute('aria-label',t.prev);$('next').setAttribute('aria-label',t.next);
  $('tabs').innerHTML=P.map(function(p,i){return '<button class="tab" type="button" role="tab" data-i="'+i+'"><b>'+('0'+(i+1)).slice(-2)+'</b>'+esc(p[5][lang][0])+'</button>'}).join('');
  meta();markTab(false);
}
function meta(){
  var p=P[cur],s=STAT[p[4]];
  $('pcat').textContent=CATS[lang][p[3]];
  $('pst').className='st '+s.c;$('pst').lastChild.textContent=s[lang];
  $('ptitle').textContent=p[5][lang][0];$('pben').textContent=p[5][lang][1];
  $('pnum').textContent=('0'+(cur+1)).slice(-2)+' / '+P.length;
}

/* ---------- карусель проектов ---------- */
var cur=0,timer=null,tidy=null,seq=0,paused=false;
var track=$('track'),vp=$('vp'),tabs=$('tabs');
track.innerHTML=P.map(function(p){return '<div class="slide"><iframe title="'+esc(p[5].ru[0])+'" tabindex="-1" scrolling="no"></iframe></div>'}).join('');
var frames=track.querySelectorAll('iframe');
/* одна рамка для всех проектов: содержимое окна вписывается масштабом */
var CSSFX='html.ms .stage,html.fx .stage{max-width:none;padding:0;margin:0}html.fx,html.fx body,html.fx .stage{height:100%}html.fx body{overflow:hidden}html.fx .win{height:100%;display:flex;flex-direction:column;box-shadow:none;position:relative}html.fx .win>*{flex:none}html.fx .win>.body{flex:1 1 auto;min-height:0;overflow:hidden}html.fx .win.cut::after{content:"";position:absolute;left:1px;right:1px;bottom:var(--fh,42px);height:72px;background:linear-gradient(180deg,rgba(17,19,22,0),#111316);pointer-events:none}';
/* на телефоне окно целиком помещается на экран под шапкой; высота считается один раз на ширину */
var phH=0,phW=0;
function boxWH(){var w=vp.clientWidth;if(w>=700)return [w,Math.round(w*.56)];
  if(w!==phW){phW=w;phH=Math.max(500,Math.min(640,window.innerHeight-86))}return [w,phH]}
function setH(){vp.style.height=boxWH()[1]+'px'}
function fit(i){
  try{var f=frames[i],d=f.contentDocument;if(!d||!d.body)return;var win=d.querySelector('.win');if(!win)return;
    var b=boxWH(),W=b[0],H=b[1],r=d.documentElement;
    if(!d.getElementById('fx')){var st=d.createElement('style');st.id='fx';st.textContent=CSSFX;d.head.appendChild(st);r.style.background='transparent';d.body.style.background='transparent'}
    r.classList.remove('fx');r.classList.add('ms');win.classList.remove('cut');
    var lo=W<700?Math.round(W/.92):880,hi=W<700?Math.round(W/.62):1700,L=lo,ok=false,bd=d.querySelector('.win>.body'),nh=0;if(bd)bd.style.paddingTop=bd.style.paddingLeft=bd.style.paddingRight='';
    for(;L<=hi;L+=20){f.style.width=L+'px';void f.offsetWidth;nh=win.offsetHeight;if(nh<=H*L/W){ok=true;break}}
    if(!ok){
      /* содержимое, которое растёт вместе с шириной, сужается полями */
      var Ls=W<700?[hi]:[1040,1200,1400,1700],p0=bd?parseFloat(d.defaultView.getComputedStyle(bd).paddingLeft):0,k,pp;
      for(k=0;k<Ls.length&&!ok&&bd;k++){L=Ls[k];f.style.width=L+'px';void f.offsetWidth;
        for(pp=10;pp<L*.2;pp+=10){bd.style.paddingLeft=bd.style.paddingRight=(p0+pp)+'px';nh=win.offsetHeight;if(nh<=H*L/W){ok=true;break}}
        if(!ok)bd.style.paddingLeft=bd.style.paddingRight=''}
      if(!ok){L=hi;f.style.width=L+'px'}}
    var sc=W/L;f.style.height=Math.ceil(H/sc)+'px';f.style.transform='scale('+sc+')';
    if(ok&&bd){var sp=Math.floor((H/sc-nh)/2);if(sp>6)bd.style.paddingTop=(parseFloat(d.defaultView.getComputedStyle(bd).paddingTop)+sp)+'px'}
    r.classList.remove('ms');r.classList.add('fx');
    if(!ok){var ft=d.querySelector('.foot');win.style.setProperty('--fh',(ft?ft.offsetHeight:0)+'px');win.classList.add('cut')}
    f.dataset.fit=(ok?'ok ':'cut ')+L+' '+sc.toFixed(2);
  }catch(e){}
}
frames.forEach(function(f,i){f.addEventListener('load',function(){if(f.getAttribute('src')){fit(i);setTimeout(function(){fit(i)},600)}})});
function dur(i){return (P[i][1]-1)*1700+3900}
function vfile(){return (lang!=='ru'&&vLang[lang])?'visual.'+lang+'.html':'visual.html'}
/* переведённые окна подключаются сами, как только файлы появятся */
['uz','en'].forEach(function(l){try{fetch('visuals/'+P[0][0]+'/visual.'+l+'.html',{method:'HEAD'}).then(function(r){if(r.ok){vLang[l]=true;if(lang===l){paintText();go(cur)}}}).catch(function(){})}catch(e){}});
function markTab(run){
  var bs=tabs.querySelectorAll('.tab');
  bs.forEach(function(b,i){b.setAttribute('aria-selected',i===cur);b.classList.remove('run')});
  var a=bs[cur];if(!a)return;
  tabs.scrollTo({left:a.offsetLeft-tabs.clientWidth/2+a.clientWidth/2,behavior:still?'auto':'smooth'});
  if(run&&!still){a.style.setProperty('--dur',dur(cur)+'ms');void a.offsetWidth;a.classList.add('run')}
}
function go(i){
  cur=(i+P.length)%P.length;clearTimeout(timer);
  track.style.transform='translateX('+(-100*cur)+'%)';
  var m=$('pml');m.classList.add('sw');setTimeout(function(){meta();m.classList.remove('sw')},still?0:220);
  frames[cur].src='visuals/'+P[cur][0]+'/'+vfile()+'?'+(still?'static':'r='+(++seq));
  setH();
  clearTimeout(tidy);tidy=setTimeout(function(){var nx=(cur+1)%P.length;
    frames.forEach(function(f,j){if(j!==cur&&j!==nx&&f.getAttribute('src'))f.removeAttribute('src')});
    if(!frames[nx].getAttribute('src'))frames[nx].src='visuals/'+P[nx][0]+'/'+vfile()+'?step=1';},1100);
  markTab(!paused);
  if(!paused&&!still)timer=setTimeout(function(){go(cur+1)},dur(cur));
}
tabs.addEventListener('click',function(e){var b=e.target.closest('.tab');if(b)go(+b.dataset.i)});
$('prev').addEventListener('click',function(){go(cur-1)});
$('next').addEventListener('click',function(){go(cur+1)});
$('projects').addEventListener('keydown',function(e){if(e.key==='ArrowLeft')go(cur-1);if(e.key==='ArrowRight')go(cur+1)});
function setPaused(p){if(p===paused)return;paused=p;if(p){clearTimeout(timer);markTab(false)}else go(cur)}
if('IntersectionObserver' in window)new IntersectionObserver(function(en){setPaused(!en[0].isIntersecting||document.hidden)},{threshold:.2}).observe(vp);
document.addEventListener('visibilitychange',function(){setPaused(document.hidden)});
(function(){var on=false,raf=0;function tick(n){drawFigs(n);raf=on?requestAnimationFrame(tick):0}
  if(still||!('IntersectionObserver' in window)){return}
  new IntersectionObserver(function(en){on=en[0].isIntersecting;if(on&&!raf)raf=requestAnimationFrame(tick)},{rootMargin:'100px'}).observe($('steps'))})();
(function(){var nv=document.querySelector('.nav');function st(){nv.classList.toggle('stuck',window.scrollY>8)}addEventListener('scroll',st,{passive:true});st()})();
addEventListener('resize',function(){setH();frames.forEach(function(f,i){if(f.getAttribute('src'))fit(i)})});
$('lang').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;lang=b.dataset.l;try{localStorage.setItem('vk-lang',lang)}catch(x){}paintText();go(cur)});

paintText();go(0);

/* ---------- северное сияние: текучий фон на WebGL, только на широких экранах ---------- */
if(!still&&matchMedia('(min-width:721px)').matches){
  var as=document.createElement('script');as.src='vendor/color4bg/AestheticFluidBg.min.js';
  as.onload=function(){try{
    new Color4Bg.AestheticFluidBg({dom:'aurora-gl',colors:['#0B0C0E','#0E3A34','#3DE0A8','#C6F24E','#5BC8FF','#2A2466'],seed:1000,loop:true});
    $('aurora').classList.add('gl');
  }catch(e){}};
  document.head.appendChild(as);
}

})();
</script>
</body>
</html>
